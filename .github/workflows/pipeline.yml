name: Weekly Operations Report Pipeline

on:
  # Manual trigger with button in GitHub Actions UI
  workflow_dispatch:

  # Scheduled trigger: Every Monday morning at 06:00 UTC (08:00 AM Central/South Africa Time)
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build-and-run:
    name: Run Report Automation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (wkhtmltopdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline Script
        env:
          # Live API Credentials (Optional - falls back to data/ if not provided)
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SERVICEDESK_BASE_URL: ${{ secrets.SERVICEDESK_BASE_URL }}
          SERVICEDESK_AUTH_TOKEN: ${{ secrets.SERVICEDESK_AUTH_TOKEN }}

          # SMTP Email Configuration (Optional - skips email if not configured)
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          # Pipeline Settings
          AERP_SILENT: "0"
          AERP_VERBOSE_PRINT_LOG: "1"
        run: |
          python run_pipeline.py

      - name: Upload Generated Report & Outputs as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-ops-report-${{ github.run_number }}
          path: |
            AERP_Outputs/*.pptx
            AERP_Outputs/output_manifest_*.csv
            AERP_Outputs/charts/
            AERP_Outputs/logs/
          retention-days: 30

