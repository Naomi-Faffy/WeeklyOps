name: Weekly Operations Report Pipeline

on:
  # Manual trigger with button in GitHub Actions UI
  workflow_dispatch:

  # Scheduled trigger: Every Monday morning at 06:00 UTC (08:00 AM Central/South Africa Time)
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build-and-run:
    name: Run Report Automation
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          py -3.9 -m pip install --upgrade pip
          py -3.9 -m pip install -r requirements.txt

      - name: Execute Pipeline Script
        env:
          # Live API Credentials (Optional - falls back to data/ if not provided)
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SDP_INSTANCE_URL: ${{ secrets.SDP_INSTANCE_URL }}
          SDP_CLIENT_ID: ${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: ${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: ${{ secrets.SDP_REFRESH_TOKEN }}
          SDP_ZOHO_REGION: ${{ secrets.SDP_ZOHO_REGION }}
          SERVICEDESK_BASE_URL: ${{ secrets.SERVICEDESK_BASE_URL }}
          SERVICEDESK_AUTH_TOKEN: ${{ secrets.SERVICEDESK_AUTH_TOKEN }}

          # SMTP Email Configuration (Optional - skips email if not configured)
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          # Pipeline Settings & Encodings
          PYTHONIOENCODING: "utf-8"
          AERP_SILENT: "0"
          AERP_VERBOSE_PRINT_LOG: "1"
        run: |
          py -3.9 run_pipeline.py

      - name: Deliver Report Locally (Desktop & OneDrive)
        if: always()
        run: |
          py -3.9 -c "
          import glob, shutil, os, sys
          sys.stdout.reconfigure(encoding='utf-8')
          pptx_files = sorted(glob.glob('AERP_Outputs/*.pptx'))
          if pptx_files:
              latest = pptx_files[-1]
              filename = os.path.basename(latest)
              desktop = os.path.join(os.path.expanduser('~'), 'Desktop')
              onedrive = r'C:\Users\TafaraChitiyo-I-\OneDrive - ZHD Consulting\Automation_Project\reports'
              if os.path.exists(desktop):
                  shutil.copy2(latest, os.path.join(desktop, filename))
                  print(f'[OK] Delivered to Desktop: {filename}')
              if os.path.exists(onedrive):
                  shutil.copy2(latest, os.path.join(onedrive, filename))
                  print(f'[OK] Delivered to OneDrive reports: {filename}')
          else:
              print('[WARN] No PPTX found in AERP_Outputs')
          "

      - name: Upload Generated Report & Outputs as Artifact (Optional Cloud Backup)
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: weekly-ops-report-${{ github.run_number }}
          path: |
            AERP_Outputs/*.pptx
            AERP_Outputs/output_manifest_*.csv
            AERP_Outputs/charts/
            AERP_Outputs/logs/
          retention-days: 7
