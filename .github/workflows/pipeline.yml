name: Weekly Operations Report Pipeline

on:
  # Manual trigger with button in GitHub Actions UI
  workflow_dispatch:

  # Scheduled trigger: Every Monday morning at 06:00 UTC (08:00 AM Central/South Africa Time)
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build-and-run:
    name: Run Report Automation
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          py -3.9 -m pip install --upgrade pip
          py -3.9 -m pip install -r requirements.txt

      - name: Execute Pipeline Script
        env:
          # Live API Credentials (Optional - falls back to data/ if not provided)
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SDP_INSTANCE_URL: ${{ secrets.SDP_INSTANCE_URL }}
          SDP_CLIENT_ID: ${{ secrets.SDP_CLIENT_ID }}
          SDP_CLIENT_SECRET: ${{ secrets.SDP_CLIENT_SECRET }}
          SDP_REFRESH_TOKEN: ${{ secrets.SDP_REFRESH_TOKEN }}
          SDP_ZOHO_REGION: ${{ secrets.SDP_ZOHO_REGION }}
          SERVICEDESK_BASE_URL: ${{ secrets.SERVICEDESK_BASE_URL }}
          SERVICEDESK_AUTH_TOKEN: ${{ secrets.SERVICEDESK_AUTH_TOKEN }}

          # SMTP Email Configuration (Optional - skips email if not configured)
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          # Pipeline Settings & Encodings
          PYTHONIOENCODING: "utf-8"
          AERP_SILENT: "0"
          AERP_VERBOSE_PRINT_LOG: "1"
        run: |
          py -3.9 run_pipeline.py

      - name: Deliver Report Locally to Desktop
        if: always()
        run: |
          py -3.9 -c "import glob, shutil, os, sys; (lambda pptx: (shutil.copy2(pptx[-1], os.path.join(os.path.expanduser('~'), 'Desktop')) and print('[OK] Copied latest report to Desktop:', pptx[-1])) if pptx else print('[WARN] No PPTX found'))(sorted(glob.glob('AERP_Outputs/*.pptx')))"

      - name: Upload Generated Report & Outputs as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: weekly-ops-report-${{ github.run_number }}
          path: |
            AERP_Outputs/*.pptx
            AERP_Outputs/output_manifest_*.csv
            AERP_Outputs/charts/
            AERP_Outputs/logs/
          retention-days: 7
